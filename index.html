<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Own Two Feet</title>
<meta name="description" content="Be born. Learn to stand. Make an endless world your own.">
<link rel="stylesheet" href="css/style.css">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" async onerror="window.__cgFail=1"></script>
<script src="vendor/peerjs.min.js" defer></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="letterbox"><div class="bar top"></div><div class="bar bottom"></div></div>
  <div id="hud" class="hidden">
    <div id="hud-tl">
      <div id="vessels"></div>
      <div id="breath"><div id="breath-fill"></div></div>
      <div id="glimmer"><span class="gem"></span><span id="glimmer-n">0</span></div>
    </div>
    <div id="hud-tr">
      <div id="souls-online" class="pill hidden"></div>
      <button id="btn-together" class="pill btn" title="Play together">Together</button>
      <button id="btn-menu" class="pill btn icon" title="Menu (Esc)">&#9776;</button>
    </div>
    <div id="compass"></div>
    <div id="hotbar"></div>
    <div id="prompt" class="hidden"></div>
    <div id="toasts"></div>
    <div id="pickups"></div>
  </div>
  <div id="bossbar" class="hidden"><div class="bname"></div><div class="btrack"><div class="bfill"></div><div class="bghost"></div></div></div>
  <div id="hint" class="hidden"></div>
  <div id="card" class="hidden"><div class="line l1"></div><div class="title"></div><div class="sub"></div><div class="line l2"></div></div>
  <div id="dialog" class="hidden"><div class="who"></div><div class="text"></div><div class="opts"></div></div>
  <div id="fade"></div>
  <div id="menu" class="hidden">
    <div class="panel">
      <div class="menu-head"><div class="logo">Own Two Feet</div><div class="tabs"></div></div>
      <div class="menu-body"></div>
    </div>
  </div>
  <div id="press" class="hidden"></div>
  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <div id="tbtns">
      <button data-a="attack" class="tb big">&#9876;</button>
      <button data-a="jump" class="tb big">&#8593;</button>
      <button data-a="dash" class="tb">&#187;</button>
      <button data-a="interact" class="tb">E</button>
      <button data-a="heal" class="tb">&#10084;</button>
      <button data-a="tbuild" class="tb">&#9638;</button>
    </div>
  </div>
</div>
<div id="boot"><div class="boot-title">Own Two Feet</div><div class="boot-bar"><div></div></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
